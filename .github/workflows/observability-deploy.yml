name: Observability Deploy

# Fluxo unico pos-Entrypoint.
#
# DEPLOY instala/atualiza o Collector, provisiona New Relic por upsert
# (dashboard, alertas, Synthetics e notificacao opcional) e valida os sinais.
# VALIDATE e somente leitura: nao cria Secret, nao roda Helm apply, nao aplica
# Kubernetes e nao executa mutations NerdGraph.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'DEPLOY altera recursos; VALIDATE somente revalida.'
        required: true
        default: 'DEPLOY'
        type: choice
        options:
          - DEPLOY
          - VALIDATE
      confirmation:
        description: 'Digite DEPLOY quando mode=DEPLOY. Para VALIDATE pode ficar vazio.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # cancel-in-progress: false de proposito. Cancelar no meio de um helm upgrade
  # deixa o release travado em pending-upgrade.
  group: observability
  cancel-in-progress: false

jobs:
  observability:
    name: Provisionar e validar observabilidade
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
      NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION }}
      NEW_RELIC_NOTIFICATION_EMAIL: ${{ vars.NEW_RELIC_NOTIFICATION_EMAIL }}
      OBSERVABILITY_MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve observability configuration
        id: config
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          # Entrada livre do dispatch chega por env, nunca interpolada no corpo do
          # script: a expressao e expandida antes de o shell existir, e uma aspa
          # no valor deixaria de ser dado para virar codigo.
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-Configured {
            param([string[]]$Values)
            foreach ($value in $Values) {
              if ([string]::IsNullOrWhiteSpace($value)) { return $false }
            }
            return $true
          }

          function Set-Flag {
            param([string]$Name, [bool]$Value)
            $text = if ($Value) { 'true' } else { 'false' }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "$Name=$text"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($Name.ToUpperInvariant())=$text"
          }

          $mode = $env:OBSERVABILITY_MODE.Trim().ToUpperInvariant()
          if ($mode -notin @('DEPLOY', 'VALIDATE')) {
            throw "Modo invalido: $env:OBSERVABILITY_MODE. Use DEPLOY ou VALIDATE."
          }

          $awsRegion = if ([string]::IsNullOrWhiteSpace($env:AWS_REGION)) { '' } else { $env:AWS_REGION.Trim() }
          $newRelicRegion = if ([string]::IsNullOrWhiteSpace($env:NEW_RELIC_REGION)) { 'US' } else { $env:NEW_RELIC_REGION.Trim().ToUpperInvariant() }
          if ($newRelicRegion -notin @('US', 'EU')) {
            throw "NEW_RELIC_REGION deve ser US ou EU quando informada (atual: $env:NEW_RELIC_REGION)."
          }

          $awsConfigured = Test-Configured @($awsRegion, $env:AWS_ACCESS_KEY_ID, $env:AWS_SECRET_ACCESS_KEY)
          $newRelicManagementConfigured = Test-Configured @($env:NEW_RELIC_ACCOUNT_ID, $env:NEW_RELIC_USER_API_KEY)
          $newRelicProvisioningConfigured = $newRelicManagementConfigured -and (Test-Configured @($env:NEW_RELIC_LICENSE_KEY))

          if (-not $awsConfigured) {
            throw 'AWS_REGION, AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY sao obrigatorios para Observability Deploy.'
          }
          if (-not $newRelicManagementConfigured) {
            throw 'NEW_RELIC_ACCOUNT_ID e NEW_RELIC_USER_API_KEY sao obrigatorios para Observability Deploy.'
          }
          if ($env:NEW_RELIC_ACCOUNT_ID -notmatch '^\d+$') {
            throw 'NEW_RELIC_ACCOUNT_ID deve ser numerico.'
          }

          if ($mode -eq 'DEPLOY') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Deploy so a partir de refs/heads/main (atual: $env:GITHUB_REF)."
            }
            if ($env:CONFIRMATION -cne 'DEPLOY') {
              throw 'Confirmacao invalida. Digite DEPLOY para executar o caminho que altera recursos.'
            }
            if (-not $newRelicProvisioningConfigured) {
              throw 'NEW_RELIC_LICENSE_KEY e obrigatoria no modo DEPLOY para instalar/atualizar o Collector.'
            }
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "new_relic_region=$newRelicRegion"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NEW_RELIC_REGION=$newRelicRegion"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "AWS_REGION=$awsRegion"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "OBSERVABILITY_MODE=$mode"

          Set-Flag -Name 'collector_deploy_enabled' -Value ($mode -eq 'DEPLOY')
          Set-Flag -Name 'collector_validate_enabled' -Value ($mode -eq 'VALIDATE')
          Set-Flag -Name 'new_relic_provisioning_enabled' -Value ($mode -eq 'DEPLOY')

          Write-Host "Modo: $mode"
          Write-Host "AWS configurada: $awsConfigured"
          Write-Host "New Relic management configurado: $newRelicManagementConfigured"
          Write-Host "New Relic provisioning configurado: $newRelicProvisioningConfigured"

      - name: Validate observability config
        shell: pwsh
        run: ./scripts/validate-observability-config.ps1

      - name: Test post-renderer contract
        shell: bash
        run: |
          set -euo pipefail
          # O post-renderer altera manifesto que sera aplicado no cluster: o
          # contrato precisa ser provado antes de qualquer upgrade.
          sh observability/scripts/test-post-render.sh

      - name: Test NerdGraph query contract
        shell: pwsh
        run: ./observability/scripts/test-nerdgraph-query-contract.ps1

      - name: Test New Relic upsert contract
        shell: pwsh
        run: ./observability/scripts/test-newrelic-upsert-contract.ps1

      - name: Test Helm operation contract
        shell: pwsh
        run: ./observability/scripts/test-helm-operation-contract.ps1

      - name: Test Helm operation shell contract
        shell: bash
        run: |
          set -euo pipefail
          sh observability/scripts/test-helm-operation-shell.sh

      - name: Test New Relic validation polling contract
        shell: pwsh
        run: ./observability/scripts/test-validate-newrelic-polling.ps1

      - name: Test Observability workflow contract
        shell: pwsh
        run: ./observability/scripts/test-observability-workflow-contract.ps1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve platform outputs
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          instance=$(aws ssm get-parameter --name /oficina/infra/k8s/instance-id \
            --region "$AWS_REGION" --query Parameter.Value --output text)
          namespace=$(aws ssm get-parameter --name /oficina/infra/k8s/namespace \
            --region "$AWS_REGION" --query Parameter.Value --output text)

          api_url=$(aws ssm get-parameter --name /oficina/infra/api/url \
            --region "$AWS_REGION" --query Parameter.Value --output text 2>/dev/null || echo '')
          if [ "$api_url" = 'None' ]; then
            api_url=''
          fi
          if [ -z "$api_url" ]; then
            echo 'URL publica ausente em /oficina/infra/api/url. Execute o Entrypoint Deploy antes do Observability Deploy.' >&2
            exit 1
          fi

          echo "::add-mask::$api_url"
          echo "instance=$instance" >> "$GITHUB_OUTPUT"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "api_ready=true" >> "$GITHUB_OUTPUT"
          echo "correlation_id=observability-validation-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

          echo "node: $instance | namespace: $namespace | API publica resolvida"

      - name: Wait for SSM Online
        shell: bash
        run: |
          set -euo pipefail
          instance='${{ steps.platform.outputs.instance }}'
          for _ in $(seq 1 30); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$instance" --region "$AWS_REGION" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo 'Unknown')
            if [ "$status" = 'Online' ]; then
              echo "node $instance Online."
              exit 0
            fi
            sleep 10
          done
          echo "node $instance nao ficou Online no Systems Manager." >&2
          exit 1

      - name: Install or update the New Relic Collector
        if: ${{ steps.config.outputs.collector_deploy_enabled == 'true' }}
        shell: pwsh
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./observability/scripts/install-newrelic-collector.ps1 `
            -AwsRegion $env:AWS_REGION `
            -RunId $env:GITHUB_RUN_ID `
            -LicenseKey $env:NEW_RELIC_LICENSE_KEY

      - name: Validate existing New Relic Collector
        if: ${{ steps.config.outputs.collector_validate_enabled == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./observability/scripts/install-newrelic-collector.ps1 `
            -AwsRegion $env:AWS_REGION `
            -RunId $env:GITHUB_RUN_ID `
            -ReadOnly

      - name: Validate internal OTLP endpoint
        shell: bash
        run: |
          set -euo pipefail
          instance='${{ steps.platform.outputs.instance }}'
          namespace='${{ steps.platform.outputs.namespace }}'

          cat > /tmp/otlp-check.sh <<'EOF'
          set -eu
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          export PATH="$PATH:/usr/local/bin"
          gateway_namespace="newrelic"
          gateway_service="nr-k8s-otel-collector-gateway"
          alvo="$gateway_service.$gateway_namespace.svc.cluster.local"

          k3s kubectl -n "$gateway_namespace" get service "$gateway_service" >/dev/null
          endpoints="$(k3s kubectl -n "$gateway_namespace" get endpoints "$gateway_service" \
            -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{"\n"}{end}' 2>/dev/null || true)"
          ports="$(k3s kubectl -n "$gateway_namespace" get endpoints "$gateway_service" \
            -o jsonpath='{range .subsets[*].ports[*]}{.port}{"\n"}{end}' 2>/dev/null || true)"
          if [ -z "$endpoints" ] || ! printf '%s\n' "$ports" | grep -qx '4317'; then
            echo "Gateway OTLP sem endpoint pronto em $alvo:4317." >&2
            exit 1
          fi
          echo "gateway OTLP com endpoint(s): $(printf '%s' "$endpoints" | tr '\n' ' ')"

          pod="$(k3s kubectl -n NAMESPACE_PLACEHOLDER get pods -l app.kubernetes.io/component=api \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -z "$pod" ]; then
            pod="$(k3s kubectl -n NAMESPACE_PLACEHOLDER get pods -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          fi
          if [ -z "$pod" ]; then
            echo "namespace NAMESPACE_PLACEHOLDER ainda sem Pods de API. Execute os deploys das APIs antes do Observability Deploy." >&2
            exit 1
          fi

          echo "pod de API encontrado para diagnostico best-effort: $pod"
          if k3s kubectl -n NAMESPACE_PLACEHOLDER exec "$pod" -- sh -c "command -v nc >/dev/null 2>&1 && nc -z -w 10 $alvo 4317" 2>/dev/null; then
            echo 'OTLP_REACHABLE_FROM_API_POD=true'
          else
            echo 'Pod de API sem ferramenta TCP compativel; Service/Endpoints do gateway continuam sendo a validacao obrigatoria.'
          fi
          echo 'OTLP_GATEWAY_READY=true'
          EOF
          sed -i "s|NAMESPACE_PLACEHOLDER|$namespace|g" /tmp/otlp-check.sh
          jq -Rs '{commands: [.]}' < /tmp/otlp-check.sh > /tmp/otlp-check.json

          command_id=$(aws ssm send-command --instance-ids "$instance" \
            --document-name AWS-RunShellScript --comment 'OTLP interno' \
            --region "$AWS_REGION" --parameters file:///tmp/otlp-check.json \
            --query 'Command.CommandId' --output text)

          status=Pending
          for _ in $(seq 1 40); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$instance" --region "$AWS_REGION" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
            --region "$AWS_REGION" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
            --region "$AWS_REGION" --query StandardErrorContent --output text >&2
          test "$status" = 'Success'

      - name: Provision New Relic resources
        if: ${{ steps.config.outputs.new_relic_provisioning_enabled == 'true' }}
        shell: pwsh
        env:
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          API_URL: ${{ steps.platform.outputs.api_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argumentos = @{
            AccountId      = $env:NEW_RELIC_ACCOUNT_ID
            UserApiKey     = $env:NEW_RELIC_USER_API_KEY
            NewRelicRegion = $env:NEW_RELIC_REGION
            ApiUrl         = $env:API_URL
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NEW_RELIC_NOTIFICATION_EMAIL)) {
            $argumentos['NotificationEmail'] = $env:NEW_RELIC_NOTIFICATION_EMAIL
          }
          ./observability/scripts/provision-newrelic.ps1 @argumentos

      - name: Validate telemetry in New Relic
        shell: pwsh
        env:
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          API_URL: ${{ steps.platform.outputs.api_url }}
          CORRELATION_ID: ${{ steps.platform.outputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argumentos = @{
            AwsRegion      = $env:AWS_REGION
            AccountId      = $env:NEW_RELIC_ACCOUNT_ID
            UserApiKey     = $env:NEW_RELIC_USER_API_KEY
            NewRelicRegion = $env:NEW_RELIC_REGION
            CorrelationId  = $env:CORRELATION_ID
            ApiUrl         = $env:API_URL
            RequireApiSignals = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NEW_RELIC_NOTIFICATION_EMAIL)) {
            $argumentos['NotificationEmail'] = $env:NEW_RELIC_NOTIFICATION_EMAIL
          }
          ./observability/scripts/validate-newrelic.ps1 @argumentos

      - name: Validate edge log groups and ALB metrics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          aws logs describe-log-groups --log-group-name-prefix /aws/apigateway/oficina-api \
            --region "$AWS_REGION" --query 'logGroups[0].logGroupName' --output text | grep -v '^None$'
          aws cloudwatch list-metrics --namespace AWS/ApplicationELB --metric-name HealthyHostCount \
            --region "$AWS_REGION" >/dev/null

      - name: Validate queue depth and dead-letter queues
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for queue in estoque-comandos ordens-eventos; do
            url=$(aws ssm get-parameter --name "/oficina/infra/sqs/${queue}/url" \
              --region "$AWS_REGION" --query Parameter.Value --output text)
            aws sqs get-queue-attributes --queue-url "$url" --attribute-names ApproximateNumberOfMessages \
              --region "$AWS_REGION" --query 'Attributes.ApproximateNumberOfMessages' --output text

            dlq_url=$(aws ssm get-parameter --name "/oficina/infra/sqs/${queue}-dlq/url" \
              --region "$AWS_REGION" --query Parameter.Value --output text)
            depth=$(aws sqs get-queue-attributes --queue-url "$dlq_url" --attribute-names ApproximateNumberOfMessages \
              --region "$AWS_REGION" --query 'Attributes.ApproximateNumberOfMessages' --output text)
            echo "DLQ ${queue}-dlq: ${depth} mensagem(ns)."
            if [ "$depth" != "0" ]; then
              echo "DLQ ${queue}-dlq com mensagens; investigar antes de considerar a validacao concluida." >&2
              exit 1
            fi
          done

      - name: Validate cluster workloads
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          instance='${{ steps.platform.outputs.instance }}'
          namespace='${{ steps.platform.outputs.namespace }}'

          cat > /tmp/observability-check.sh <<'EOF'
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          export PATH="$PATH:/usr/local/bin"
          k3s kubectl -n NAMESPACE_PLACEHOLDER get pods -o wide
          k3s kubectl -n NAMESPACE_PLACEHOLDER get deployments
          k3s kubectl -n newrelic get pods -o wide
          k3s kubectl describe node | sed -n '/Conditions:/,/Addresses:/p'
          free -m
          df -h /
          EOF
          sed -i "s|NAMESPACE_PLACEHOLDER|$namespace|g" /tmp/observability-check.sh
          jq -Rs '{commands: [.]}' < /tmp/observability-check.sh > /tmp/observability-check.json

          command_id=$(aws ssm send-command --instance-ids "$instance" \
            --document-name AWS-RunShellScript --comment 'Observability validation' \
            --region "$AWS_REGION" --parameters file:///tmp/observability-check.json \
            --query 'Command.CommandId' --output text)

          status=Pending
          for _ in $(seq 1 40); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
              --region "$AWS_REGION" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          {
            echo '## Estado do cluster'
            echo '```'
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
              --region "$AWS_REGION" --query StandardOutputContent --output text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = 'Success'

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Observability Deploy'
            echo ''
            echo "- Modo: ${OBSERVABILITY_MODE}"
            echo "- API publica: resolvida via /oficina/infra/api/url"
            echo "- Collector: validado em newrelic"
            echo "- New Relic: provisionamento por upsert no modo DEPLOY; somente leitura no modo VALIDATE"
          } >> "$GITHUB_STEP_SUMMARY"
