name: Observability Deploy

# Substitui o Observability Validate, preservando tudo que ele ja validava:
# log groups do API Gateway, metricas do ALB, profundidade de filas, DLQ zerada e
# estado do cluster.
#
# Duas passagens. A primeira pode rodar logo apos o Platform Deploy, antes dos
# workloads e antes do Entrypoint: instala o Collector para que as APIs ja nascam
# apontando para o gateway OTLP. Recursos que dependem da URL publica ou de Pods
# das APIs ficam pendentes ate a segunda passagem.
#
#   1. validation_only=false  application_signals_required=false
#   2. deploy Cadastro, Estoque, Ordens e depois Entrypoint
#   3. validation_only=true   application_signals_required=true
#   4. consolidacao manual apenas se a reconciliacao final da New Relic falhar.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite DEPLOY para confirmar. Em validation_only some com essa exigencia.'
        required: false
        default: ''
      validation_only:
        description: 'true = nao altera K3s/Helm/Secret; com application_signals_required=true e URL publica, reconcilia New Relic antes de validar.'
        type: boolean
        required: false
        default: false
      application_signals_required:
        description: 'true = exigir logs, spans, metricas HTTP e service.version das tres APIs. Use apenas depois do redeploy.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # cancel-in-progress: false de proposito. Cancelar no meio de um helm upgrade
  # deixa o release travado em pending-upgrade.
  group: observability
  cancel-in-progress: false

jobs:
  observability:
    name: Provisionar e validar observabilidade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
      NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION }}
      NEW_RELIC_NOTIFICATION_EMAIL: ${{ vars.NEW_RELIC_NOTIFICATION_EMAIL }}
      VALIDATION_ONLY: ${{ inputs.validation_only }}
      APPLICATION_SIGNALS_REQUIRED: ${{ inputs.application_signals_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 1. Resolver o que esta configurado, sem transformar observabilidade em
      # pre-requisito do repositorio. Se faltar AWS ou New Relic, os passos
      # correspondentes viram no-op e apenas as validacoes estaticas rodam.
      - name: Resolve optional observability configuration
        id: config
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $validationOnly = $env:VALIDATION_ONLY -eq 'true'

          function Test-Configured {
            param([string[]]$Values)
            foreach ($value in $Values) {
              if ([string]::IsNullOrWhiteSpace($value)) { return $false }
            }
            return $true
          }

          function Set-Flag {
            param([string]$Name, [bool]$Value)
            $text = if ($Value) { 'true' } else { 'false' }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "$Name=$text"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($Name.ToUpperInvariant())=$text"
          }

          $awsRegion = if ([string]::IsNullOrWhiteSpace($env:AWS_REGION)) { '' } else { $env:AWS_REGION.Trim() }
          $newRelicRegion = if ([string]::IsNullOrWhiteSpace($env:NEW_RELIC_REGION)) { 'US' } else { $env:NEW_RELIC_REGION.Trim().ToUpperInvariant() }
          if ($newRelicRegion -notin @('US', 'EU')) {
            throw "NEW_RELIC_REGION deve ser US ou EU quando informada (atual: $env:NEW_RELIC_REGION)."
          }

          $awsConfigured = Test-Configured @($awsRegion, $env:AWS_ACCESS_KEY_ID, $env:AWS_SECRET_ACCESS_KEY)
          $newRelicManagementConfigured = Test-Configured @($env:NEW_RELIC_ACCOUNT_ID, $env:NEW_RELIC_USER_API_KEY)
          $newRelicProvisioningConfigured = $newRelicManagementConfigured -and (Test-Configured @($env:NEW_RELIC_LICENSE_KEY))

          if ($newRelicManagementConfigured -and $env:NEW_RELIC_ACCOUNT_ID -notmatch '^\d+$') {
            throw "NEW_RELIC_ACCOUNT_ID deve ser numerico quando informado."
          }

          $collectorStepEnabled = $awsConfigured -and ($validationOnly -or $newRelicProvisioningConfigured)
          $otlpEndpointValidationEnabled = $awsConfigured -and (-not $validationOnly) -and $newRelicProvisioningConfigured
          $newRelicProvisioningEnabled = $awsConfigured -and (-not $validationOnly) -and $newRelicProvisioningConfigured
          $newRelicValidationEnabled = $awsConfigured -and $newRelicManagementConfigured -and ($validationOnly -or $newRelicProvisioningConfigured)

          if ($newRelicProvisioningEnabled) {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Deploy so a partir de refs/heads/main (atual: $env:GITHUB_REF)."
            }
            if ('${{ inputs.confirmation }}' -cne 'DEPLOY') {
              throw 'Confirmacao invalida. Digite DEPLOY para executar o caminho que altera recursos.'
            }
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "new_relic_region=$newRelicRegion"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NEW_RELIC_REGION=$newRelicRegion"
          if (-not [string]::IsNullOrWhiteSpace($awsRegion)) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "AWS_REGION=$awsRegion"
          }

          Set-Flag -Name 'aws_configured' -Value $awsConfigured
          Set-Flag -Name 'new_relic_management_configured' -Value $newRelicManagementConfigured
          Set-Flag -Name 'new_relic_provisioning_configured' -Value $newRelicProvisioningConfigured
          Set-Flag -Name 'collector_step_enabled' -Value $collectorStepEnabled
          Set-Flag -Name 'otlp_endpoint_validation_enabled' -Value $otlpEndpointValidationEnabled
          Set-Flag -Name 'new_relic_provisioning_enabled' -Value $newRelicProvisioningEnabled
          Set-Flag -Name 'new_relic_validation_enabled' -Value $newRelicValidationEnabled

          Write-Host "Modo: $(if ($validationOnly) { 'validacao (somente leitura)' } else { 'provisionamento' })"
          Write-Host "Sinais de aplicacao obrigatorios: $env:APPLICATION_SIGNALS_REQUIRED"
          Write-Host "AWS configurada: $awsConfigured"
          Write-Host "New Relic management configurado: $newRelicManagementConfigured"
          Write-Host "New Relic provisioning configurado: $newRelicProvisioningConfigured"
          if (-not $awsConfigured) {
            Write-Host 'AWS nao configurada: passos que consultam SSM, CloudWatch, SQS, EC2 e cluster serao ignorados.'
          }
          if (-not $newRelicManagementConfigured) {
            Write-Host 'New Relic nao configurado: validacao remota e provisionamento NerdGraph serao ignorados.'
          }
          elseif (-not $newRelicProvisioningConfigured) {
            Write-Host 'NEW_RELIC_LICENSE_KEY ausente: instalacao do Collector sera ignorada; validation_only ainda pode validar e reconciliar recursos New Relic que nao dependem da license key.'
          }

      - name: Validate observability config
        shell: pwsh
        run: ./scripts/validate-observability-config.ps1

      - name: Test post-renderer contract
        shell: bash
        run: |
          set -euo pipefail
          # O post-renderer altera manifesto que sera aplicado no cluster: o
          # contrato precisa ser provado antes de qualquer upgrade.
          sh observability/scripts/test-post-render.sh

      - name: Test NerdGraph query contract
        shell: pwsh
        run: ./observability/scripts/test-nerdgraph-query-contract.ps1

      - name: Test Helm operation contract
        shell: pwsh
        run: ./observability/scripts/test-helm-operation-contract.ps1

      - name: Test Helm operation shell contract
        shell: bash
        run: |
          set -euo pipefail
          sh observability/scripts/test-helm-operation-shell.sh

      - name: Configure AWS credentials
        if: ${{ steps.config.outputs.aws_configured == 'true' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Resolver EC2, namespace e URL publica existentes.
      - name: Resolve platform outputs
        if: ${{ steps.config.outputs.aws_configured == 'true' }}
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          instance=$(aws ssm get-parameter --name /oficina/infra/k8s/instance-id \
            --region "$AWS_REGION" --query Parameter.Value --output text)
          namespace=$(aws ssm get-parameter --name /oficina/infra/k8s/namespace \
            --region "$AWS_REGION" --query Parameter.Value --output text)

          # A URL publica pode nao existir ainda: os Synthetic Monitors so sao
          # criados depois que ela resolve.
          api_url=$(aws ssm get-parameter --name /oficina/infra/api/url \
            --region "$AWS_REGION" --query Parameter.Value --output text 2>/dev/null || echo '')
          if [ "$api_url" = 'None' ]; then
            api_url=''
          fi
          api_ready=false
          if [ -n "$api_url" ]; then
            api_ready=true
          fi

          echo "instance=$instance" >> "$GITHUB_OUTPUT"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "api_ready=$api_ready" >> "$GITHUB_OUTPUT"
          echo "correlation_id=observability-validation-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

          echo "node: $instance | namespace: $namespace"
          if [ -z "$api_url" ]; then
            echo 'URL publica indisponivel: monitores e requisicoes de origem serao registrados como pendentes.'
          fi

      # 3. Aguardar EC2 Online no SSM.
      - name: Wait for SSM Online
        if: ${{ steps.config.outputs.aws_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          instance='${{ steps.platform.outputs.instance }}'
          for _ in $(seq 1 30); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$instance" --region "$AWS_REGION" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo 'Unknown')
            if [ "$status" = 'Online' ]; then
              echo "node $instance Online."
              exit 0
            fi
            sleep 10
          done
          echo "node $instance nao ficou Online no Systems Manager." >&2
          exit 1

      # Passos 4 a 11 do install: Helm, baseline, classificacao, SecureString,
      # Secret versionado, template com post-renderer, upgrade e gates.
      - name: Install or update the New Relic Collector
        if: ${{ steps.config.outputs.collector_step_enabled == 'true' }}
        shell: pwsh
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argumentos = @{
            AwsRegion = $env:AWS_REGION
            RunId     = $env:GITHUB_RUN_ID
          }
          if ($env:VALIDATION_ONLY -eq 'true') {
            $argumentos['ValidationOnly'] = $true
          }
          else {
            $argumentos['LicenseKey'] = $env:NEW_RELIC_LICENSE_KEY
          }
          ./observability/scripts/install-newrelic-collector.ps1 @argumentos

      # 8. Validar o endpoint OTLP interno. Na primeira passagem ainda nao ha Pods
      #    das APIs, entao o gate duro e o Service/Endpoints do gateway; quando
      #    houver Pod de API, uma checagem de execucao e feita em best-effort.
      - name: Validate internal OTLP endpoint
        if: ${{ steps.config.outputs.otlp_endpoint_validation_enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          instance='${{ steps.platform.outputs.instance }}'
          namespace='${{ steps.platform.outputs.namespace }}'

          cat > /tmp/otlp-check.sh <<'EOF'
          set -eu
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          export PATH="$PATH:/usr/local/bin"
          gateway_namespace="newrelic"
          gateway_service="nr-k8s-otel-collector-gateway"
          alvo="$gateway_service.$gateway_namespace.svc.cluster.local"

          k3s kubectl -n "$gateway_namespace" get service "$gateway_service" >/dev/null
          endpoints="$(k3s kubectl -n "$gateway_namespace" get endpoints "$gateway_service" \
            -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{"\n"}{end}' 2>/dev/null || true)"
          ports="$(k3s kubectl -n "$gateway_namespace" get endpoints "$gateway_service" \
            -o jsonpath='{range .subsets[*].ports[*]}{.port}{"\n"}{end}' 2>/dev/null || true)"
          if [ -z "$endpoints" ] || ! printf '%s\n' "$ports" | grep -qx '4317'; then
            echo "Gateway OTLP sem endpoint pronto em $alvo:4317." >&2
            exit 1
          fi
          echo "gateway OTLP com endpoint(s): $(printf '%s' "$endpoints" | tr '\n' ' ')"

          pod="$(k3s kubectl -n NAMESPACE_PLACEHOLDER get pods -l app.kubernetes.io/component=api \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -z "$pod" ]; then
            pod="$(k3s kubectl -n NAMESPACE_PLACEHOLDER get pods -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          fi
          if [ -z "$pod" ]; then
            echo "namespace NAMESPACE_PLACEHOLDER ainda sem Pods de API; Service/Endpoints do gateway validados."
            echo 'OTLP_GATEWAY_READY=true'
            exit 0
          fi

          echo "pod de API encontrado para diagnostico best-effort: $pod"
          if k3s kubectl -n NAMESPACE_PLACEHOLDER exec "$pod" -- sh -c "command -v nc >/dev/null 2>&1 && nc -z -w 10 $alvo 4317" 2>/dev/null; then
            echo 'OTLP_REACHABLE_FROM_API_POD=true'
          else
            echo 'Pod de API sem ferramenta TCP compativel; Service/Endpoints do gateway continuam sendo o gate duro.'
          fi
          echo 'OTLP_GATEWAY_READY=true'
          EOF
          sed -i "s|NAMESPACE_PLACEHOLDER|$namespace|g" /tmp/otlp-check.sh
          jq -Rs '{commands: [.]}' < /tmp/otlp-check.sh > /tmp/otlp-check.json

          command_id=$(aws ssm send-command --instance-ids "$instance" \
            --document-name AWS-RunShellScript --comment 'OTLP interno' \
            --region "$AWS_REGION" --parameters file:///tmp/otlp-check.json \
            --query 'Command.CommandId' --output text)

          status=Pending
          for _ in $(seq 1 40); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$instance" --region "$AWS_REGION" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
            --region "$AWS_REGION" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
            --region "$AWS_REGION" --query StandardErrorContent --output text >&2
          test "$status" = 'Success'

      # 9 a 12. Dashboard, policy, condicoes, notificacao e Synthetic Monitors.
      # A primeira passagem provisiona o que independe do Entrypoint. Na passagem
      # final, mesmo com validation_only=true, a reconciliacao idempotente da New
      # Relic fecha os Synthetics depois que a URL publica existe. As queries que
      # dependem do gate 12 so sao persistidas depois da validacao passar.
      - name: Provision New Relic resources
        if: ${{ steps.config.outputs.new_relic_provisioning_enabled == 'true' || (inputs.validation_only == true && inputs.application_signals_required == true && steps.config.outputs.new_relic_management_configured == 'true' && steps.platform.outputs.api_ready == 'true') }}
        shell: pwsh
        env:
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argumentos = @{
            AccountId      = $env:NEW_RELIC_ACCOUNT_ID
            UserApiKey     = $env:NEW_RELIC_USER_API_KEY
            NewRelicRegion = $env:NEW_RELIC_REGION
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NEW_RELIC_NOTIFICATION_EMAIL)) {
            $argumentos['NotificationEmail'] = $env:NEW_RELIC_NOTIFICATION_EMAIL
          }
          $apiUrl = '${{ steps.platform.outputs.api_url }}'
          if (-not [string]::IsNullOrWhiteSpace($apiUrl)) {
            $argumentos['ApiUrl'] = $apiUrl
          }
          if ($env:APPLICATION_SIGNALS_REQUIRED -eq 'true' -and $env:VALIDATION_ONLY -ne 'true') {
            $argumentos['ApplicationSignalsReady'] = $true
          }
          ./observability/scripts/provision-newrelic.ps1 @argumentos

      # 13 a 15. Requisicoes com correlationId conhecido e consulta com polling.
      - name: Validate telemetry in New Relic
        if: ${{ steps.config.outputs.new_relic_validation_enabled == 'true' }}
        shell: pwsh
        env:
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argumentos = @{
            AwsRegion      = $env:AWS_REGION
            AccountId      = $env:NEW_RELIC_ACCOUNT_ID
            UserApiKey     = $env:NEW_RELIC_USER_API_KEY
            NewRelicRegion = $env:NEW_RELIC_REGION
            CorrelationId  = '${{ steps.platform.outputs.correlation_id }}'
          }
          $apiUrl = '${{ steps.platform.outputs.api_url }}'
          if (-not [string]::IsNullOrWhiteSpace($apiUrl)) {
            $argumentos['ApiUrl'] = $apiUrl
          }
          if ($env:APPLICATION_SIGNALS_REQUIRED -eq 'true') {
            $argumentos['ApplicationSignalsRequired'] = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NEW_RELIC_NOTIFICATION_EMAIL)) {
            $argumentos['NotificationEmail'] = $env:NEW_RELIC_NOTIFICATION_EMAIL
          }
          ./observability/scripts/validate-newrelic.ps1 @argumentos

      - name: Consolidate New Relic resources after validation
        if: ${{ inputs.validation_only == true && inputs.application_signals_required == true && steps.config.outputs.new_relic_management_configured == 'true' && steps.platform.outputs.api_ready == 'true' }}
        shell: pwsh
        env:
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argumentos = @{
            AccountId               = $env:NEW_RELIC_ACCOUNT_ID
            UserApiKey              = $env:NEW_RELIC_USER_API_KEY
            NewRelicRegion          = $env:NEW_RELIC_REGION
            ApiUrl                  = '${{ steps.platform.outputs.api_url }}'
            ApplicationSignalsReady = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NEW_RELIC_NOTIFICATION_EMAIL)) {
            $argumentos['NotificationEmail'] = $env:NEW_RELIC_NOTIFICATION_EMAIL
          }
          ./observability/scripts/provision-newrelic.ps1 @argumentos

      # Validacoes preservadas do Observability Validate anterior.
      - name: Validate edge log groups and ALB metrics
        if: ${{ always() && steps.config.outputs.aws_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          api_ready='${{ steps.platform.outputs.api_ready }}'
          if [ "$api_ready" = 'true' ]; then
            aws logs describe-log-groups --log-group-name-prefix /aws/apigateway/oficina-api \
              --region "$AWS_REGION" --query 'logGroups[0].logGroupName' --output text | grep -v '^None$'
          else
            echo 'API Gateway ainda nao publicada: log group /aws/apigateway/oficina-api fica pendente ate o Entrypoint Deploy.'
            {
              echo '## Validacao de borda'
              echo ''
              echo '- API Gateway ainda nao publicada: access log group pendente ate o Entrypoint Deploy.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          aws cloudwatch list-metrics --namespace AWS/ApplicationELB --metric-name HealthyHostCount \
            --region "$AWS_REGION" >/dev/null

      - name: Validate queue depth and dead-letter queues
        if: ${{ always() && steps.config.outputs.aws_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for queue in estoque-comandos ordens-eventos; do
            url=$(aws ssm get-parameter --name "/oficina/infra/sqs/${queue}/url" \
              --region "$AWS_REGION" --query Parameter.Value --output text)
            aws sqs get-queue-attributes --queue-url "$url" --attribute-names ApproximateNumberOfMessages \
              --region "$AWS_REGION" --query 'Attributes.ApproximateNumberOfMessages' --output text

            dlq_url=$(aws ssm get-parameter --name "/oficina/infra/sqs/${queue}-dlq/url" \
              --region "$AWS_REGION" --query Parameter.Value --output text)
            depth=$(aws sqs get-queue-attributes --queue-url "$dlq_url" --attribute-names ApproximateNumberOfMessages \
              --region "$AWS_REGION" --query 'Attributes.ApproximateNumberOfMessages' --output text)
            echo "DLQ ${queue}-dlq: ${depth} mensagem(ns)."
            if [ "$depth" != "0" ]; then
              echo "DLQ ${queue}-dlq com mensagens; investigar antes de considerar a validacao concluida." >&2
              exit 1
            fi
          done

      - name: Validate cluster workloads
        if: ${{ always() && steps.config.outputs.aws_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          instance='${{ steps.platform.outputs.instance }}'
          namespace='${{ steps.platform.outputs.namespace }}'

          cat > /tmp/observability-check.sh <<'EOF'
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          export PATH="$PATH:/usr/local/bin"
          k3s kubectl -n NAMESPACE_PLACEHOLDER get pods -o wide
          k3s kubectl -n NAMESPACE_PLACEHOLDER get deployments
          k3s kubectl -n newrelic get pods -o wide 2>/dev/null || echo 'namespace newrelic ausente'
          k3s kubectl describe node | sed -n '/Conditions:/,/Addresses:/p'
          free -m
          df -h /
          EOF
          sed -i "s|NAMESPACE_PLACEHOLDER|$namespace|g" /tmp/observability-check.sh
          jq -Rs '{commands: [.]}' < /tmp/observability-check.sh > /tmp/observability-check.json

          command_id=$(aws ssm send-command --instance-ids "$instance" \
            --document-name AWS-RunShellScript --comment 'Observability validation' \
            --region "$AWS_REGION" --parameters file:///tmp/observability-check.json \
            --query 'Command.CommandId' --output text)

          status=Pending
          for _ in $(seq 1 40); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
              --region "$AWS_REGION" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          {
            echo '## Estado do cluster'
            echo '```'
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
              --region "$AWS_REGION" --query StandardOutputContent --output text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = 'Success'

      - name: Publish next steps
        if: always()
        shell: bash
        run: |
          api_ready='${{ steps.platform.outputs.api_ready }}'
          {
            echo '## Proximos passos'
            echo ''
            if [ "${AWS_CONFIGURED:-false}" != 'true' ]; then
              echo '- AWS nao configurada: nenhum passo remoto de SSM, CloudWatch, SQS, EC2 ou cluster foi executado.'
            fi
            if [ "${NEW_RELIC_MANAGEMENT_CONFIGURED:-false}" != 'true' ]; then
              echo '- New Relic nao configurado: nenhum recurso NerdGraph foi provisionado ou validado.'
            elif [ "${NEW_RELIC_PROVISIONING_CONFIGURED:-false}" != 'true' ]; then
              echo '- NEW_RELIC_LICENSE_KEY ausente: Collector e provisionamento real foram ignorados.'
            fi
            if [ "${AWS_CONFIGURED:-false}" != 'true' ] || [ "${NEW_RELIC_MANAGEMENT_CONFIGURED:-false}" != 'true' ]; then
              echo ''
              echo 'Somente as validacoes estaticas e o contrato do post-renderer foram executados.'
              exit 0
            fi
            if [ "${VALIDATION_ONLY}" != 'true' ] && [ "${NEW_RELIC_PROVISIONING_CONFIGURED:-false}" != 'true' ]; then
              echo ''
              echo 'Nenhum Collector ou recurso New Relic foi provisionado nesta execucao.'
              exit 0
            fi

            if [ "${APPLICATION_SIGNALS_REQUIRED}" != 'true' ]; then
              if [ "$api_ready" = 'true' ]; then
                echo '1. Reexecutar ou confirmar os deploys de Cadastro, Estoque e Ordens se os sinais ainda estiverem pendentes.'
                echo '2. Reexecutar este workflow com `validation_only=true` e `application_signals_required=true`.'
              else
                echo '1. Continuar a sequencia: Cadastro, Initial Admin, Estoque, Ordens e Entrypoint.'
                echo '2. Reexecutar este workflow com `validation_only=true` e `application_signals_required=true` depois do Entrypoint.'
              fi
              echo ''
              echo 'Sinais das APIs e Synthetic Monitors ficam pendentes ate existirem Pods instrumentados e URL publica.'
            else
              echo 'Validacao com sinais obrigatorios executada. Se a reconciliacao final da New Relic falhou, reexecutar com `validation_only=false` e `application_signals_required=true` para consolidar manualmente.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
